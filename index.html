<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thaís • Moldura para foto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111}body{display:flex;justify-content:center;font-family:Arial,sans-serif}.stage{position:relative;width:min(100vw,calc(100vh * 9 / 16));aspect-ratio:9/16;overflow:hidden;background:#111}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;display:block;z-index:2;-webkit-tap-highlight-color:transparent}.debug .hotspot{outline:3px solid red;background:#ff000033}
body.editor-mode{display:block;background:#111;padding-bottom:190px}.editor-mode .stage{margin:auto}.editor-mode .hotspot{outline:3px solid #00e5ff;background:#00e5ff33;touch-action:none;cursor:move}.label{display:none;position:absolute;left:5px;top:5px;background:#000c;color:#fff;padding:5px 7px;border-radius:6px;font-weight:700;font-size:12px;pointer-events:none}.editor-mode .label{display:block}.handle{display:none;position:absolute;right:-12px;bottom:-12px;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #111;touch-action:none}.editor-mode .handle{display:block}#panel{display:none;position:fixed;z-index:10;left:0;right:0;bottom:0;background:#111f;color:#fff;padding:12px;box-shadow:0 -4px 20px #0008}.editor-mode #panel{display:block}.inner{max-width:700px;margin:auto}.help{font-size:12px;line-height:1.4;margin:5px 0 9px;opacity:.9}textarea{width:100%;height:48px;background:#222;color:#aaffaa;border:1px solid #555;border-radius:7px;padding:7px;font:12px monospace}button{width:100%;margin-top:8px;padding:11px;border:0;border-radius:8px;background:#20c96b;font-weight:800}
</style>
</head>
<body>
<main class="stage" id="stage">
<img class="art" src="assets/tela-inicial.png" alt="Tela inicial">
<a id="molduraBtn" class="hotspot" href="foto.html" aria-label="Abrir moldura para foto"><span class="label">MOLDURA PARA FOTO</span><span class="handle"></span></a>
</main>
<section id="panel"><div class="inner"><b>Editor da área clicável</b><div class="help">Arraste a área azul até o botão que já está desenhado na sua imagem. Use a bolinha branca para redimensionar. Ao terminar, baixe o config.js e substitua o antigo.</div><textarea id="coords" readonly></textarea><button id="download">Baixar config.js atualizado</button></div></section>
<script src="config.js"></script>
<script>
const cfg=window.EVENTO_CONFIG||{}, area=(cfg.botaoPrincipal||{x:20,y:65,largura:60,altura:12}), el=document.getElementById('molduraBtn'), stage=document.getElementById('stage'), params=new URLSearchParams(location.search), editor=params.get('editor')==='1';
function apply(){el.style.left=area.x+'%';el.style.top=area.y+'%';el.style.width=area.largura+'%';el.style.height=area.altura+'%'}apply();
if(params.get('debug')==='1')stage.classList.add('debug');
if(editor){document.body.classList.add('editor-mode');el.onclick=e=>e.preventDefault();const out=document.getElementById('coords'),h=el.querySelector('.handle');let s=null;const rnd=n=>Math.round(n*10)/10,pct=(n,t)=>n/t*100;function sync(){area.x=rnd(parseFloat(el.style.left));area.y=rnd(parseFloat(el.style.top));area.largura=rnd(parseFloat(el.style.width));area.altura=rnd(parseFloat(el.style.height));out.value=`botaoPrincipal: { x: ${area.x}, y: ${area.y}, largura: ${area.largura}, altura: ${area.altura} }`}
el.onpointerdown=e=>{if(e.target===h)return;e.preventDefault();el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();s={m:'move',sx:e.clientX,sy:e.clientY,l:r.left,t:r.top}};h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();h.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();s={m:'resize',sx:e.clientX,sy:e.clientY,w:r.width,h:r.height}};function move(e){if(!s)return;const sr=stage.getBoundingClientRect(),er=el.getBoundingClientRect();if(s.m==='move'){let l=s.l+e.clientX-s.sx-sr.left,t=s.t+e.clientY-s.sy-sr.top;l=Math.max(0,Math.min(l,sr.width-er.width));t=Math.max(0,Math.min(t,sr.height-er.height));el.style.left=pct(l,sr.width)+'%';el.style.top=pct(t,sr.height)+'%'}else{let w=Math.max(35,s.w+e.clientX-s.sx),hh=Math.max(35,s.h+e.clientY-s.sy);w=Math.min(w,sr.right-er.left);hh=Math.min(hh,sr.bottom-er.top);el.style.width=pct(w,sr.width)+'%';el.style.height=pct(hh,sr.height)+'%'}sync()}el.onpointermove=move;h.onpointermove=move;['pointerup','pointercancel'].forEach(t=>{el.addEventListener(t,()=>s=null);h.addEventListener(t,()=>s=null)});sync();document.getElementById('download').onclick=()=>{sync();cfg.botaoPrincipal=area;const blob=new Blob(['window.EVENTO_CONFIG = '+JSON.stringify(cfg,null,2)+';\n'],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
</script>
</body></html>
